# This repository has its own issue forms, so the organization defaults in
# any-table/.github do not appear here. Problems with the text belong in
# any-table/anytable, where those forms live.

blank_issues_enabled: false

contact_links:
  - name: Problem with the text or its sources
    url: https://github.com/any-table/anytable/issues/new/choose
    about: The wording of the card, the full text, and its sources are kept in any-table/anytable. Report them there; this repository only runs the directory.

  - name: Questions and discussion
    url: https://github.com/any-table/anytable/discussions
    about: Ask questions, discuss interpretation, or share ideas that are not yet concrete changes.

  - name: Safeguarding and private matters
    url: https://github.com/any-table/anytable/blob/main/FOUNDATIONAL.md#on-harm-within
    about: The directory is not a reporting body. Do not post abuse reports, complaints about a person, hard-truth statements, or information about children or vulnerable people in a public issue.
