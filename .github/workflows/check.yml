# Checks every pull request: the Worker must bundle, and the full end-to-end
# smoke test must pass against a fresh local database.

name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle
        run: npm run check
      - name: End-to-end test
        run: npm test
